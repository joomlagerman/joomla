COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class='fw-medium'>Willkommen bei Joomla 6.2!</h1><div class='row align-items-center pt-4'><h2 class='mb-3'>Neuerungen im Core</h2><div class='col-12 mb-3'><h3>Verbesserungen bei der Inhaltsbearbeitung</h3><ul><li><strong>Integration von Medien-Manager und „Weiterlesen“</strong>: Das Einfügen von Bildern und Medien ist einfacher geworden: Die überarbeitete Auswahl öffnet jetzt den Joomla-Medien-Manager, und mit der neuen „Weiterlesen“-Schaltfläche lassen sich Beitragsumbrüche schneller einfügen.</li><li><strong>Getrennte CSS-Klassen für Bild und figure-Element</strong>: Einleitungs- und Beitragsbilder haben jetzt eigene CSS-Klassen-Felder für das Bild und das umgebende figure-Element.</li></ul></div></div><div class='row align-items-center pt-1'><div class='col-md-6 col-lg-7 mb-4'><img class='img-fluid d-block mx-auto' src='../media/com_guidedtours/images/6_2/sublevel_menu.jpg' alt='Menüs mit Unterebenen' width='383' height='280'></div><div class='col-md-6 col-lg-5'><h3>Frontend-Template (Cassiopeia)</h3><ul><li><strong>Mehrstufige Dropdown-Menüs</strong>: Cassiopeia-Menüs unterstützen jetzt mehr als eine Unterebene in Dropdown- und einklappbaren Layouts.</li></ul></div></div><div class='row align-items-center pt-1'><div class='col-md-6 col-lg-7 my-3'><h3>Module &amp; Website-Konfiguration</h3><ul class='mb-3'><li><strong>Schalter für Links in mod_login</strong>: Mit neuen Optionen können Administratoren die Links „Passwort vergessen?“ und „Benutzername vergessen?“ ohne Template-Override ausblenden. Der Standardwert ist „Anzeigen“, bestehende Websites sind daher nicht betroffen.</li><li><strong>Sicherheitskennzeichnung für Erweiterungsupdates</strong>: Entwickler können eine Version als Sicherheitsupdate kennzeichnen (Sicherheitsrelevanz „Keine“ bis „Kritisch“); gekennzeichnete Updates werden unter System -&gt; Updates -&gt; Erweiterungen und im Schnellstartsymbol des Dashboards hervorgehoben.</li></ul></div><div class='col-md-6 col-lg-5'><img class='img-fluid d-block mx-auto' src='../media/com_guidedtours/images/6_2/security_warning.jpg' alt='Sicherheitskennzeichnungen bei Erweiterungen' width='488' height='144'></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Was ist neu in Joomla 6.2!"
